
<!DOCTYPE html>
<html>
<head>
    <title>Student Result Program</title>

    <style>
        body{
            font-family: Times New Roman;
            margin: 50px;
        }

        h1{
            font-size: 55px;
        }

        label{
            font-size: 30px;
        }

        input{
            width: 280px;
            height: 35px;
            font-size: 28px;
        }

        button{
            height: 42px;
            font-size: 28px;
            cursor: pointer;
        }

        #result{
            margin-top: 30px;
            font-size: 28px;
        }
    </style>
</head>

<body>

    <h1>Student Result Program</h1>

    <label>Enter Number of Subjects:</label>

    <input type="number" id="subjects">

    <button onclick="calculate()">Calculate</button>

    <div id="result"></div>

    <script>

        function calculate()
        {
            let n = document.getElementById("subjects").value;

            let total = 0;

            for(let i = 1; i <= n; i++)
            {
                let marks = parseInt(prompt("Enter marks of Subject " + i));

                total = total + marks;
            }

            let average = total / n;

            let grade = "";

            if(average >= 70)
            {
                grade = "A";
            }
            else if(average >= 60)
            {
                grade = "B";
            }
            else if(average >= 40)
            {
                grade = "C";
            }
            else
            {
                grade = "Fail";
            }

            document.getElementById("result").innerHTML =
            "Total Marks = " + total + "<br><br>" +
            "Average Marks = " + average + "<br><br>" +
            "Grade = " + grade;
        }

    </script>

</body>
</html>
