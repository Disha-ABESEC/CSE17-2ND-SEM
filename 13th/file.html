<!DOCTYPE html>
<html>
<head>
  <title>React Currency Converter</title>

  <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <style>
    body{
      font-family: Arial;
      background:#0f172a;
      color:white;
      text-align:center;
      margin-top:100px;
    }

    .box{
      width:400px;
      margin:auto;
      background:#1e293b;
      padding:30px;
      border-radius:10px;
    }

    input{
      width:80%;
      padding:10px;
      font-size:18px;
      margin:10px;
    }

    button{
      padding:10px 20px;
      font-size:18px;
      border:none;
      border-radius:5px;
      cursor:pointer;
      background:green;
      color:white;
    }

    h2{
      color:cyan;
    }
  </style>
</head>

<body>

<div id="root"></div>

<script type="text/babel">

function CurrencyConverter(){

  const [rupees,setRupees] = React.useState("");
  const [dollars,setDollars] = React.useState("");

  function convert(){

    let usd = (rupees / 85).toFixed(2);
    setDollars(usd);
  }

  return(
    <div className="box">

      <h1>💱 Currency Converter</h1>

      <input
        type="number"
        placeholder="Enter Rupees"
        value={rupees}
        onChange={(e)=>setRupees(e.target.value)}
      />

      <br/>

      <button onClick={convert}>
        Convert to USD
      </button>

      <h2>
        ${dollars}
      </h2>

    </div>
  );
}

ReactDOM.createRoot(
document.getElementById("root")
).render(<CurrencyConverter/>);

</script>

</body>
</html>
