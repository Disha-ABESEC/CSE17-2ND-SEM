<!DOCTYPE html>
<html>
<head>
  <title>React BMI Calculator</title>

  <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <style>
    body {
      margin: 0;
      padding: 0;
      background: #1e1e2f;
      font-family: Arial;
      text-align: center;
      color: white;
    }

    .container {
      width: 400px;
      margin: 100px auto;
      background: #2c2c3e;
      padding: 30px;
      border-radius: 12px;
      box-shadow: 0px 0px 10px gray;
    }

    input {
      width: 85%;
      padding: 12px;
      margin: 10px 0;
      font-size: 18px;
      border: none;
      border-radius: 5px;
    }

    button {
      padding: 12px 25px;
      margin-top: 15px;
      font-size: 18px;
      border: none;
      border-radius: 8px;
      background: limegreen;
      color: white;
      cursor: pointer;
    }

    .result {
      margin-top: 25px;
      font-size: 28px;
      color: cyan;
    }
  </style>
</head>

<body>

<div id="root"></div>

<script type="text/babel">

function BMIApp() {

  const [height, setHeight] = React.useState("");
  const [weight, setWeight] = React.useState("");
  const [bmi, setBmi] = React.useState("");

  function calculateBMI() {

    let h = height / 100;

    let result =
      (weight / (h * h)).toFixed(2);

    setBmi(result);
  }

  return (
    <div className="container">

      <h1>BMI Calculator ⚖️</h1>

      <input
        type="number"
        placeholder="Enter height (cm)"
        onChange={(e) => setHeight(e.target.value)}
      />

      <input
        type="number"
        placeholder="Enter weight (kg)"
        onChange={(e) => setWeight(e.target.value)}
      />

      <br />

      <button onClick={calculateBMI}>
        Calculate BMI
      </button>

      <div className="result">
        BMI: {bmi}
      </div>

    </div>
  );
}

ReactDOM.createRoot(
  document.getElementById("root")
).render(<BMIApp />);

</script>

</body>
</html>
