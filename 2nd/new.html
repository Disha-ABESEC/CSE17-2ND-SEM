<!DOCTYPE html>
<html>
<head>
  <title>React Expense Tracker</title>

  <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <style>
    body{
      font-family: Arial;
      background:#f4f4f4;
      text-align:center;
    }

    .container{
      width:500px;
      margin:50px auto;
      background:white;
      padding:20px;
      border-radius:10px;
      box-shadow:0 0 10px gray;
    }

    input{
      width:80%;
      padding:10px;
      margin:10px;
      font-size:16px;
    }

    button{
      padding:10px 20px;
      background:green;
      color:white;
      border:none;
      cursor:pointer;
      border-radius:5px;
    }

    .expense{
      display:flex;
      justify-content:space-between;
      background:#eee;
      margin:10px 0;
      padding:10px;
      border-radius:5px;
    }

    .total{
      font-size:25px;
      color:blue;
      margin-top:20px;
    }
  </style>
</head>

<body>

<div id="root"></div>

<script type="text/babel">

function ExpenseTracker(){

  const [item,setItem] = React.useState("");
  const [amount,setAmount] = React.useState("");
  const [expenses,setExpenses] = React.useState([]);

  function addExpense(){

    if(item === "" || amount === ""){
      alert("Fill all fields");
      return;
    }

    setExpenses([
      ...expenses,
      {
        item:item,
        amount:Number(amount)
      }
    ]);

    setItem("");
    setAmount("");
  }

  const total = expenses.reduce(
    (sum,e)=>sum + e.amount,
    0
  );

  return(
    <div className="container">

      <h1>Expense Tracker 💰</h1>

      <input
        type="text"
        placeholder="Expense Name"
        value={item}
        onChange={(e)=>setItem(e.target.value)}
      />

      <input
        type="number"
        placeholder="Amount"
        value={amount}
        onChange={(e)=>setAmount(e.target.value)}
      />

      <br/>

      <button onClick={addExpense}>
        Add Expense
      </button>

      {expenses.map((e,index)=>(
        <div className="expense" key={index}>
          <span>{e.item}</span>
          <span>₹{e.amount}</span>
        </div>
      ))}

      <div className="total">
        Total: ₹{total}
      </div>

    </div>
  );
}

ReactDOM.createRoot(
document.getElementById("root")
).render(<ExpenseTracker/>);

</script>

</body>
</html>
