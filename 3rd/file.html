
<!DOCTYPE html>
<html>
<head>
  <title>Notes App</title>

  <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <style>
    body {
      margin: 0;
      padding: 0;
      background: #f4f4f4;
      font-family: Arial;
      text-align: center;
    }

    .container {
      width: 500px;
      margin: 50px auto;
      background: white;
      padding: 30px;
      border-radius: 10px;
      box-shadow: 0px 0px 10px gray;
    }

    textarea {
      width: 90%;
      height: 100px;
      padding: 10px;
      font-size: 18px;
      margin-bottom: 20px;
    }

    button {
      padding: 10px 20px;
      font-size: 18px;
      border: none;
      border-radius: 5px;
      background: blue;
      color: white;
      cursor: pointer;
    }

    .note {
      background: #e8e8e8;
      padding: 15px;
      margin-top: 15px;
      border-radius: 5px;
      text-align: left;
    }
  </style>
</head>

<body>

<div id="root"></div>

<script type="text/babel">

function NotesApp() {

  const [text, setText] = React.useState("");
  const [notes, setNotes] = React.useState([]);

  function addNote() {

    if(text === "") {
      alert("Write something");
      return;
    }

    setNotes([...notes, text]);
    setText("");
  }

  return (
    <div className="container">

      <h1>Notes App 📝</h1>

      <textarea
        placeholder="Write your note..."
        value={text}
        onChange={(e) => setText(e.target.value)}
      />

      <br />

      <button onClick={addNote}>
        Add Note
      </button>

      {notes.map((note, index) => (

        <div className="note" key={index}>
          {note}
        </div>

      ))}

    </div>
  );
}

ReactDOM.createRoot(
  document.getElementById("root")
).render(<NotesApp />);

</script>

</body>
</html>
