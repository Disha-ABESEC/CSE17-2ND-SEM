<!DOCTYPE html>
<html>
<head>
  <title>React Student Result Calculator</title>

  <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <style>
    body{
      font-family: Arial;
      background:#0f172a;
      color:white;
      text-align:center;
    }

    .container{
      width:500px;
      margin:50px auto;
      background:#1e293b;
      padding:25px;
      border-radius:10px;
    }

    input{
      width:80%;
      padding:10px;
      margin:10px;
      font-size:16px;
    }

    button{
      padding:10px 20px;
      background:green;
      color:white;
      border:none;
      border-radius:5px;
      cursor:pointer;
    }

    .result{
      margin-top:20px;
      font-size:22px;
      color:cyan;
    }
  </style>
</head>

<body>

<div id="root"></div>

<script type="text/babel">

function ResultCalculator(){

  const [m1,setM1] = React.useState("");
  const [m2,setM2] = React.useState("");
  const [m3,setM3] = React.useState("");
  const [result,setResult] = React.useState("");

  function calculate(){

    const total =
      Number(m1) + Number(m2) + Number(m3);

    const percentage =
      (total / 300 * 100).toFixed(2);

    let grade = "";

    if(percentage >= 90)
      grade = "A+";
    else if(percentage >= 75)
      grade = "A";
    else if(percentage >= 60)
      grade = "B";
    else if(percentage >= 40)
      grade = "C";
    else
      grade = "Fail";

    setResult(
      `Total: ${total}/300 | Percentage: ${percentage}% | Grade: ${grade}`
    );
  }

  return(
    <div className="container">

      <h1>🎓 Student Result Calculator</h1>

      <input
        type="number"
        placeholder="Subject 1 Marks"
        onChange={(e)=>setM1(e.target.value)}
      />

      <input
        type="number"
        placeholder="Subject 2 Marks"
        onChange={(e)=>setM2(e.target.value)}
      />

      <input
        type="number"
        placeholder="Subject 3 Marks"
        onChange={(e)=>setM3(e.target.value)}
      />

      <br />

      <button onClick={calculate}>
        Calculate Result
      </button>

      <div className="result">
        {result}
      </div>

    </div>
  );
}

ReactDOM.createRoot(
document.getElementById("root")
).render(<ResultCalculator />);

</script>

</body>
</html>
